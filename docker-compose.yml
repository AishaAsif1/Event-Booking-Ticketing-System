services:
  # 1. Database Service
  postgres-db:
    image: postgres:15-alpine
    container_name: booking-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: event_booking_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-env
    container_name: booking-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    environment:
      - DATABASE_URL=postgresql://myuser:mypassword@postgres-db:5432/event_booking_db?schema=public
      - PORT=5000
      - JWT_SECRET=your_mock_jwt_secret_here
    depends_on:
      - postgres-db

  # 3. Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-env
    container_name: booking-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

volumes:
  pgdata:

