services:
  postgres-db:
    image: postgres:15-alpine
    container_name: booking-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: event_booking_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backend-env
    container_name: booking-backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgres-db:5432/event_booking_db?schema=public
      PORT: 5000
      JWT_SECRET: your_mock_jwt_secret_here
      NODE_ENV: production
    depends_on:
      - postgres-db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: frontend-env
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: booking-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend

volumes:
  pgdata: